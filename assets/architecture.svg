<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#70c6a9"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff9798"/>
    </marker>
  </defs>

  <!-- Background: Pyxel palette color 1 -->
  <rect width="960" height="560" rx="14" fill="#2b335f"/>
  <text x="32" y="44" font-size="22" font-weight="bold" fill="#e9c35b">How a duel runs</text>
  <text x="32" y="68" font-size="13" fill="#a9c1ff">One rules engine, three ways to play it. The engine only asks questions; who answers is swappable.</text>

  <!-- Energy strip -->
  <g font-size="11" fill="#000000">
    <rect x="700" y="30" width="44" height="18" rx="3" fill="#d4186c"/><text x="707" y="43">Ignis</text>
    <rect x="748" y="30" width="44" height="18" rx="3" fill="#7696de"/><text x="757" y="43">Gelo</text>
    <rect x="796" y="30" width="44" height="18" rx="3" fill="#19959c"/><text x="808" y="43">Aer</text>
    <rect x="844" y="30" width="44" height="18" rx="3" fill="#eeeeee"/><text x="852" y="43">Ordo</text>
    <rect x="892" y="30" width="44" height="18" rx="3" fill="#395c98"/><text x="900" y="43" fill="#eeeeee">Chao</text>
  </g>

  <!-- ===== Left column: data -> cards -> duel ===== -->
  <g font-size="12" fill="#eeeeee">
    <rect x="32" y="100" width="210" height="96" rx="8" fill="#000000" stroke="#e9c35b" stroke-width="2"/>
    <text x="46" y="124" font-size="14" font-weight="bold" fill="#e9c35b">data/cards.json</text>
    <text x="46" y="146">units: HP, energy types</text>
    <text x="46" y="164">techniques: damage, cost</text>
    <text x="46" y="182">effects: poison, paralyze</text>

    <rect x="32" y="232" width="210" height="76" rx="8" fill="#000000" stroke="#a9c1ff" stroke-width="2"/>
    <text x="46" y="256" font-size="14" font-weight="bold" fill="#a9c1ff">CardFactory</text>
    <text x="46" y="278">JSON -&gt; Unit, Energy,</text>
    <text x="46" y="296">Technique, Effect objects</text>

    <rect x="32" y="344" width="210" height="96" rx="8" fill="#000000" stroke="#a9c1ff" stroke-width="2"/>
    <text x="46" y="368" font-size="14" font-weight="bold" fill="#a9c1ff">new_duel(seed)</text>
    <text x="46" y="390">builds 2 decks of 22,</text>
    <text x="46" y="408">seeded shuffle and coin</text>
    <text x="46" y="426">flip: reproducible games</text>
  </g>
  <line x1="137" y1="196" x2="137" y2="228" stroke="#70c6a9" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="137" y1="308" x2="137" y2="340" stroke="#70c6a9" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="242" y1="392" x2="282" y2="392" stroke="#70c6a9" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ===== Center: rules engine ===== -->
  <rect x="286" y="100" width="330" height="430" rx="10" fill="#8b4852" stroke="#eeeeee" stroke-width="2"/>
  <text x="302" y="128" font-size="16" font-weight="bold" fill="#eeeeee">Duel: rules engine (scr/)</text>
  <text x="302" y="148" font-size="11" fill="#edc7b0">pure Python, never imports Pyxel</text>

  <g font-size="12" fill="#eeeeee">
    <!-- Turn loop -->
    <rect x="302" y="162" width="298" height="214" rx="8" fill="#000000" opacity="0.55"/>
    <text x="316" y="184" font-size="13" font-weight="bold" fill="#e9c35b">Turn loop</text>
    <circle cx="324" cy="204" r="9" fill="#70c6a9"/><text x="320" y="208" fill="#000000" font-size="11">1</text>
    <text x="342" y="208">start: poison ticks, paralysis</text>
    <circle cx="324" cy="234" r="9" fill="#70c6a9"/><text x="320" y="238" fill="#000000" font-size="11">2</text>
    <text x="342" y="238">draw: 9 cards first, then 1</text>
    <circle cx="324" cy="264" r="9" fill="#70c6a9"/><text x="320" y="268" fill="#000000" font-size="11">3</text>
    <text x="342" y="268">act: 1 energy, 1 unit,</text>
    <text x="342" y="284">each unit attacks once</text>
    <circle cx="324" cy="310" r="9" fill="#70c6a9"/><text x="320" y="314" fill="#000000" font-size="11">4</text>
    <text x="342" y="314">end: poison ticks again</text>
    <circle cx="324" cy="340" r="9" fill="#70c6a9"/><text x="320" y="344" fill="#000000" font-size="11">5</text>
    <text x="342" y="344">check: player HP 0 -&gt; win,</text>
    <text x="342" y="360">no units left at all -&gt; draw</text>

    <!-- State -->
    <rect x="302" y="390" width="143" height="124" rx="8" fill="#000000" opacity="0.55"/>
    <text x="314" y="412" font-size="13" font-weight="bold" fill="#e9c35b">Board</text>
    <text x="314" y="432">5 unit slots</text>
    <text x="314" y="448">  per player</text>
    <text x="314" y="468">energy deposit</text>
    <text x="314" y="488">graveyard</text>

    <rect x="457" y="390" width="143" height="124" rx="8" fill="#000000" opacity="0.55"/>
    <text x="469" y="412" font-size="13" font-weight="bold" fill="#e9c35b">Technique</text>
    <text x="469" y="432">usable if unit</text>
    <text x="469" y="448">+ field energies</text>
    <text x="469" y="464">cover the cost</text>
    <text x="469" y="488">-&gt; damage +</text>
    <text x="469" y="504">   effects</text>
  </g>

  <!-- ===== Arrows engine <-> interface ===== -->
  <line x1="616" y1="230" x2="664" y2="230" stroke="#ff9798" stroke-width="2.5" marker-end="url(#arrowPink)"/>
  <line x1="664" y1="262" x2="616" y2="262" stroke="#70c6a9" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="620" y="220" font-size="11" fill="#ff9798">asks</text>
  <text x="620" y="280" font-size="11" fill="#70c6a9">answers</text>

  <!-- ===== Right column: decision interface ===== -->
  <g font-size="12" fill="#eeeeee">
    <rect x="668" y="100" width="260" height="190" rx="10" fill="#000000" stroke="#ff9798" stroke-width="2"/>
    <text x="684" y="126" font-size="14" font-weight="bold" fill="#ff9798">Decision interface</text>
    <text x="684" y="152">runTurn()</text>
    <text x="684" y="172">selectSlot(slots)</text>
    <text x="684" y="192">selectTarget(targets)</text>
    <text x="684" y="212">show_transition(text)</text>
    <text x="684" y="240" font-size="11" fill="#a9c1ff">returns a Slot, or None when</text>
    <text x="684" y="256" font-size="11" fill="#a9c1ff">the player cancels (right click)</text>
    <text x="684" y="276" font-size="11" fill="#a9c1ff">implemented by:</text>

    <rect x="668" y="306" width="260" height="62" rx="8" fill="#395c98"/>
    <text x="682" y="328" font-size="13" font-weight="bold">DuelGUI  (ui/, Pyxel)</text>
    <text x="682" y="348" font-size="11">human: mouse, 256x256 retro</text>
    <text x="682" y="362" font-size="11">window  -&gt; main.py</text>

    <rect x="668" y="380" width="260" height="62" rx="8" fill="#7e2072"/>
    <text x="682" y="402" font-size="13" font-weight="bold">AI_UserInterface</text>
    <text x="682" y="422" font-size="11">rule-based priorities: energy,</text>
    <text x="682" y="436" font-size="11">unit, then lowest-HP target</text>

    <rect x="668" y="454" width="260" height="62" rx="8" fill="#19959c"/>
    <text x="682" y="476" font-size="13" font-weight="bold" fill="#000000">Headless: AI vs AI</text>
    <text x="682" y="496" font-size="11" fill="#000000">no window at all</text>
    <text x="682" y="510" font-size="11" fill="#000000">-&gt; simulate.py, tests/</text>
  </g>
</svg>
